<!DOCTYPE html>
<html>
<head>
    <title>Login - Praktek dr Galih</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .login-container {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            padding: 20px;
        }
        .login-card {
            background: white;
            border-radius: 20px;
            padding: 40px;
            width: 400px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            text-align: center;
        }
        .login-card h1 {
            color: #667eea;
            margin-bottom: 10px;
            font-size: 28px;
        }
        .login-card h2 {
            color: #764ba2;
            margin-bottom: 30px;
            font-size: 18px;
        }
        .login-card input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 2px solid #ddd;
            border-radius: 10px;
            font-size: 16px;
            transition: 0.3s;
        }
        .login-card input:focus {
            border-color: #667eea;
            outline: none;
        }
        .login-card button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
            transition: transform 0.2s;
        }
        .login-card button:hover {
            transform: translateY(-2px);
        }
        .error {
            color: #e74c3c;
            margin-bottom: 15px;
            padding: 10px;
            background: #fde5e5;
            border-radius: 8px;
        }
        .demo {
            margin-top: 20px;
            font-size: 12px;
            color: #888;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <h1>🏥 Praktek Mandiri</h1>
            <h2>dr. Galih</h2>
            {% if error %}
                <div class="error">{{ error }}</div>
            {% endif %}
            <form method="POST">
                <input type="text" name="username" placeholder="Username" required>
                <input type="password" name="password" placeholder="Password" required>
                <button type="submit">Login</button>
            </form>
            <div class="demo">Demo: admin / admin123</div>
        </div>
    </div>
</body>
</html>
