<!DOCTYPE html>
<html>
<head>
    <title>Edit Pasien - dr Galih</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
            min-height: 100vh;
        }
        .container {
            max-width: 700px;
            margin: 0 auto;
        }
        .card {
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        h2 {
            color: #667eea;
            margin-bottom: 5px;
            text-align: center;
        }
        .subtitle {
            text-align: center;
            color: #764ba2;
            margin-bottom: 25px;
            font-size: 14px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            font-weight: bold;
            color: #333;
            margin-bottom: 5px;
            font-size: 13px;
        }
        input, select, textarea {
            width: 100%;
            padding: 10px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 14px;
            font-family: inherit;
        }
        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #667eea;
        }
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 15px;
        }
        button:hover {
            transform: translateY(-2px);
        }
        .btn-back {
            display: block;
            text-align: center;
            margin-top: 15px;
            padding: 10px;
            background: #6c757d;
            color: white;
            text-decoration: none;
            border-radius: 10px;
        }
        @media (max-width: 600px) {
            .form-row { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="card">
        <h2>✏️ Edit Data Pasien</h2>
        <div class="subtitle">No RM: {{ pasien.no_rm }}</div>
        
        <form method="POST">
            <div class="form-group">
                <label>Nama Lengkap</label>
                <input type="text" name="nama" value="{{ pasien.nama }}" required>
            </div>
            
            <div class="form-row">
                <div class="form-group">
                    <label>Tanggal Lahir</label>
                    <input type="date" name="tgl_lahir" value="{{ pasien.tgl_lahir }}">
                </div>
                <div class="form-group">
                    <label>Jenis Kelamin</label>
                    <select name="jenis_kelamin">
                        <option value="">-- Pilih --</option>
                        <option value="Laki-laki" {% if pasien.jenis_kelamin == 'Laki-laki' %}selected{% endif %}>Laki-laki</option>
                        <option value="Perempuan" {% if pasien.jenis_kelamin == 'Perempuan' %}selected{% endif %}>Perempuan</option>
                    </select>
                </div>
            </div>
            
            <div class="form-row">
                <div class="form-group">
                    <label>Pekerjaan</label>
                    <input type="text" name="pekerjaan" value="{{ pasien.pekerjaan or '' }}">
                </div>
                <div class="form-group">
                    <label>No. Telepon</label>
                    <input type="text" name="no_telp" value="{{ pasien.no_telp or '' }}">
                </div>
            </div>
            
            <div class="form-group">
                <label>Alamat</label>
                <textarea name="alamat" rows="3">{{ pasien.alamat or '' }}</textarea>
            </div>
            
            <div class="form-row">
                <div class="form-group">
                    <label>Alergi</label>
                    <input type="text" name="alergi" value="{{ pasien.alergi or '' }}" placeholder="Contoh: Penisilin">
                </div>
                <div class="form-group">
                    <label>Riwayat Penyakit</label>
                    <input type="text" name="riwayat_penyakit" value="{{ pasien.riwayat_penyakit or '' }}" placeholder="Contoh: Hipertensi">
                </div>
            </div>
            
            <button type="submit">💾 Simpan Perubahan</button>
            <a href="/dashboard" class="btn-back">← Kembali ke Dashboard</a>
        </form>
    </div>
</div>
</body>
</html>
