<!DOCTYPE html>
<html>
<head>
    <title>Login - dr Galih</title>
    <style>
        body { font-family: Arial; background: #667eea; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .card { background: white; padding: 40px; border-radius: 10px; width: 350px; }
        input, button { width: 100%; padding: 10px; margin: 10px 0; }
        button { background: #667eea; color: white; border: none; cursor: pointer; }
        .error { color: red; }
    </style>
</head>
<body>
    <div class="card">
        <h2>🏥 Praktek dr Galih</h2>
        {% if error %}<p class="error">{{ error }}</p>{% endif %}
        <form method="POST">
            <input type="text" name="username" placeholder="Username" required>
            <input type="password" name="password" placeholder="Password" required>
            <button type="submit">Login</button>
        </form>
        <p style="margin-top:20px">admin / admin123</p>
    </div>
</body>
</html>
