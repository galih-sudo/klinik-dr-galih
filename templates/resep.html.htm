<!DOCTYPE html>
<html>
<head>
    <title>Resep Obat - dr Galih</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
        }
        .container {
            max-width: 600px;
            margin: 50px auto;
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        h2 {
            color: #667eea;
            margin-bottom: 20px;
        }
        select, input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 2px solid #ddd;
            border-radius: 10px;
            font-size: 16px;
        }
        button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
        }
        .skip {
            text-align: center;
            margin-top: 15px;
        }
        .skip a {
            color: #667eea;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>💊 Resep Obat</h2>
        <form method="POST">
            <select name="obat_id" required>
                <option value="">Pilih Obat</option>
                {% for o in obat_list %}
                <option value="{{ o.id }}">{{ o.nama }} (stok: {{ o.stok }} {{ o.satuan }})</option>
                {% endfor %}
            </select>
            <input type="number" name="jumlah" placeholder="Jumlah" required>
            <input type="text" name="aturan" placeholder="Aturan Pakai (contoh: 3x1 tablet)" required>
            <button type="submit">Simpan Resep</button>
        </form>
        <div class="skip">
            <a href="/dashboard">Skip (Lanjut ke Dashboard)</a>
        </div>
    </div>
</body>
</html>
