<!DOCTYPE html>
<html>
<head>
    <title>SOAP - Rekam Medis | dr Galih</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: Segoe UI, Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
            min-height: 100vh;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        .card {
            background: white;
            border-radius: 20px;
            padding: 35px;
            margin-bottom: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        h2 {
            color: #667eea;
            margin-bottom: 5px;
            text-align: center;
        }
        .subtitle {
            text-align: center;
            color: #764ba2;
            margin-bottom: 25px;
            font-size: 14px;
        }
        .info {
            background: #e8f4f8;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 25px;
        }
        .info p {
            margin: 5px 0;
            font-size: 14px;
        }
        .info strong {
            color: #667eea;
        }
        label {
            display: block;
            font-weight: bold;
            color: #333;
            margin-top: 15px;
            margin-bottom: 8px;
        }
        textarea, input, select {
            width: 100%;
            padding: 12px;
            margin: 5px 0 15px 0;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 15px;
            font-family: inherit;
            transition: 0.3s;
        }
        textarea:focus, input:focus, select:focus {
            outline: none;
            border-color: #667eea;
        }
        button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            transition: transform 0.2s;
        }
        button:hover {
            transform: translateY(-2px);
        }
        .btn-back {
            display: block;
            text-align: center;
            margin-top: 15px;
            padding: 10px;
            background: #6c757d;
            color: white;
            text-decoration: none;
            border-radius: 10px;
            font-weight: bold;
        }
        .btn-back:hover {
            background: #5a6268;
        }
        .mega-note {
            background: #fff3cd;
            padding: 10px;
            border-radius: 8px;
            font-size: 12px;
            color: #856404;
            margin-top: -10px;
            margin-bottom: 15px;
        }
    </style>
    <script>
        function updateDiagnosis() {
            let select = document.getElementById(icd_select);
            let manualInput = document.getElementById(assessment);
            if (select.value && select.value !== "LAINNYA") {
                let selectedText = select.options[select.selectedIndex].text;
                manualInput.value = selectedText;
            } else if (select.value === "LAINNYA") {
                manualInput.value = "";
                manualInput.focus();
            }
        }
    </script>
</head>
<body>
<div class="container">
    <div class="card">
        <h2>📋 SOAP - Rekam Medis</h2>
        <div class="subtitle">Subjective, Objective, Assessment, Planning</div>

        <div class="info">
            <p><strong>👤 Pasien:</strong> {{ pasien.nama }}</p>
            <p><strong>🏷️ No. RM:</strong> {{ pasien.no_rm or "-" }}</p>
            <p><strong>📅 Tanggal Lahir:</strong> {{ pasien.tgl_lahir or "-" }}</p>
        </div>

        <form method="POST">
            <label>📝 Subjective (Keluhan Pasien):</label>
            <textarea name="subjective" rows="3" placeholder="Apa yang dirasakan pasien?" required></textarea>

            <label>🔍 Objective (Hasil Pemeriksaan):</label>
            <textarea name="objective" rows="3" placeholder="TD, Suhu, Fisik, dll"></textarea>

            <label>💊 Assessment (Diagnosis) - Pilih dari ICD-10:</label>
            <select id="icd_select" onchange="updateDiagnosis()">
                <option value="">-- Pilih Diagnosis ICD-10 --</option>
                {% if icd_list %}
                    {% for icd in icd_list %}
                    <option value="{{ icd.kode }}">{{ icd.kode }} - {{ icd.nama_penyakit }}</option>
                    {% endfor %}
                {% else %}
                    <option value="">⚠️ Data ICD-10 tidak tersedia</option>
                {% endif %}
                <option value="LAINNYA">Lainnya (isi manual)</option>
            </select>

            <label>Atau tulis diagnosis manual:</label>
            <input type="text" id="assessment" name="assessment" placeholder="Diagnosis / Penyakit">

            <label>📋 Planning (Tatalaksana):</label>
            <textarea name="planning" rows="3" placeholder="Terapi, Edukasi, Rujukan"></textarea>

            <label>📎 Link Lampiran (Mega/Google Drive):</label>
            <input type="url" name="lampiran_mega" placeholder="https://mega.nz/file/xxx#key">
            <div class="mega-note">
                💡 Upload hasil lab/rontgen ke Mega/Drive, lalu paste link-nya di sini.
            </div>

            <button type="submit">💾 Simpan & Lanjut ke Resep</button>
            <a href="/dashboard" class="btn-back">← Kembali ke Dashboard</a>
        </form>
    </div>
</div>
</body>
</html>
