<!DOCTYPE html>
<html>
<head>
    <title>Stok Obat - dr Galih</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
            min-height: 100vh;
        }
        .container { max-width: 1000px; margin: 0 auto; }
        .card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        h2 { color: #667eea; margin-bottom: 5px; text-align: center; font-size: 20px; }
        .subtitle { text-align: center; color: #764ba2; margin-bottom: 20px; font-size: 13px; }
        .form-tambah { background: #f0f0f0; padding: 15px; border-radius: 10px; margin-bottom: 20px; }
        .form-tambah input { padding: 8px; margin: 5px; border: 1px solid #ddd; border-radius: 5px; }
        .form-tambah button { padding: 8px 15px; background: #28a745; color: white; border: none; border-radius: 5px; cursor: pointer; }
        table { width: 100%; border-collapse: collapse; font-size: 13px; }
        th, td { padding: 10px 8px; text-align: left; border-bottom: 1px solid #eee; }
        th { background: #f8f9fa; color: #667eea; }
        .btn-update { background: #2196f3; color: white; border: none; padding: 4px 10px; border-radius: 4px; cursor: pointer; }
        .btn-delete { background: #e74c3c; color: white; padding: 4px 10px; border-radius: 4px; text-decoration: none; font-size: 11px; display: inline-block; margin-left: 5px; }
        .btn-back { display: inline-block; margin-top: 15px; padding: 8px 16px; background: #6c757d; color: white; text-decoration: none; border-radius: 8px; }
        .search-box { padding: 10px; margin-bottom: 15px; background: #f8f9fa; border-radius: 8px; }
        .search-box input { padding: 6px; width: 200px; border: 1px solid #ddd; border-radius: 4px; }
        @media (max-width: 768px) { body { padding: 10px; } table { font-size: 11px; } th, td { padding: 6px 4px; } }
    </style>
    <script>
        function searchTable() {
            let input = document.getElementById("searchInput");
            let filter = input.value.toUpperCase();
            let table = document.getElementById("obatTable");
            let tr = table.getElementsByTagName("tr");
            for (let i = 1; i < tr.length; i++) {
                let td = tr[i].getElementsByTagName("td")[0];
                if (td) {
                    let txt = td.textContent || td.innerText;
                    tr[i].style.display = txt.toUpperCase().indexOf(filter) > -1 ? "" : "none";
                }
            }
        }
    </script>
</head>
<body>
<div class="container">
    <div class="card">
        <h2>💊 Manajemen Stok Obat</h2>
        <div class="subtitle">Kelola data obat, stok, dan satuan</div>

        <div class="form-tambah">
            <h3>➕ Tambah Obat Baru</h3>
            <form method="POST" action="/obat/tambah">
                <input type="text" name="nama" placeholder="Nama Obat" required>
                <input type="number" name="stok" placeholder="Stok" required>
                <input type="text" name="satuan" placeholder="Satuan" required>
                <button type="submit">+ Tambah</button>
            </form>
        </div>

        <div class="search-box">
            <span>🔍 Cari Obat: </span>
            <input type="text" id="searchInput" onkeyup="searchTable()" placeholder="Ketik nama obat...">
        </div>

        <div style="overflow-x: auto;">
            <table id="obatTable">
                <thead>
                    <tr><th>Nama Obat</th><th>Stok</th><th>Satuan</th><th>Aksi</th></tr>
                </thead>
                <tbody>
                    {% for o in obat_list %}
                    <tr id="row-{{ o.id }}">
                        <form method="POST" action="/obat/edit/{{ o.id }}" style="display:inline">
                            <td><input type="text" name="nama" value="{{ o.nama }}" style="width:150px" required></td>
                            <td><input type="number" name="stok" value="{{ o.stok }}" style="width:70px" required></td>
                            <td><input type="text" name="satuan" value="{{ o.satuan }}" style="width:80px" required></td>
                            <td><button type="submit" class="btn-update">Update</button></form>
                            <a href="/obat/hapus/{{ o.id }}" class="btn-delete" onclick="return confirm('Hapus {{ o.nama }}?')">Hapus</a>
                        </td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>

        <div style="text-align: center;">
            <a href="/dashboard" class="btn-back">← Kembali ke Dashboard</a>
        </div>
    </div>
</div>
</body>
</html>
